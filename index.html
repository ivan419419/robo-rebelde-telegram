<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>Robô Rebelde — Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{color-scheme:dark;--bg:#090d16;--panel:#101827;--line:#243249;--muted:#8293ad;--cyan:#5ef2dc;--violet:#a88bff;--gold:#ffd76a;--red:#ff6482}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -20%,#18243a 0%,var(--bg) 58%);color:#edf4ff;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
  body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .shell{width:min(100%,1000px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 2px 14px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:38px;height:38px;border:1px solid #3a526c;border-radius:11px;display:grid;place-items:center;color:var(--cyan);font-size:21px;background:#101c2b;box-shadow:0 0 22px #5ef2dc16}
  h1{margin:0;font-size:clamp(16px,3vw,21px);letter-spacing:.11em;font-weight:800}
  .subtitle{font-size:10px;color:var(--muted);letter-spacing:.18em;margin-top:4px}
  .status{font-size:10px;color:var(--muted);letter-spacing:.12em;text-align:right}
  .board{border:1px solid var(--line);border-radius:16px;background:#0b111d;overflow:hidden;box-shadow:0 24px 80px #0008,0 0 0 1px #ffffff05 inset}
  .hud{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:linear-gradient(180deg,#121b2a,#0d1522)}
  .stat{padding:13px 18px;border-right:1px solid #1d293b;min-width:0}.stat:last-child{border:0}
  .label{font-size:9px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
  .value{font-size:clamp(15px,3vw,20px);font-weight:800;letter-spacing:.04em;white-space:nowrap}.value small{font-size:11px;color:var(--muted);font-weight:500}
  #score{color:var(--gold)}#level{color:var(--violet)}#speed{color:var(--cyan)}#energy{color:var(--red);letter-spacing:.1em}
  .canvas-wrap{position:relative;background:#0a101a}
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;outline:none;touch-action:manipulation}
  .inputbar{min-height:66px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0e1623}
  .prompt-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--cyan);background:#5ef2dc12;border:1px solid #5ef2dc30;font-weight:900}
  .input-copy{min-width:0;flex:1}.input-label{font-size:9px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
  #typed{display:block;width:100%;min-height:22px;padding:0;border:0;outline:0;background:transparent;color:var(--cyan);font:inherit;font-size:17px;font-weight:800;letter-spacing:.15em}
  #typed::placeholder{color:#65758d;font-size:12px;font-weight:500;letter-spacing:.04em;opacity:1}
  #typed.empty{color:#65758d;font-size:12px;font-weight:500;letter-spacing:.04em}
  .inputbar:focus-within{border-color:#5ef2dc88}
  .game-action{display:block;width:100%;min-height:48px;margin:12px 0 0;border:1px solid #5ef2dc;border-radius:10px;background:#12242d;color:var(--cyan);font:800 14px ui-monospace,SFMono-Regular,monospace;letter-spacing:.06em;touch-action:manipulation}
  .game-action:active{background:#1a3440;transform:translateY(1px)}
  .keys{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}.keys b{color:#d8e3f4;font-weight:600}
  footer{display:flex;justify-content:space-between;gap:12px;margin:11px 3px 0;color:#697a94;font-size:10px;letter-spacing:.05em}
  .legend{display:flex;gap:16px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block}.c-cyan{background:var(--cyan)}.c-violet{background:var(--violet)}.c-gold{background:var(--gold)}
  @media(max-width:600px){body{align-items:flex-start}.stat{padding:11px 9px}.label{font-size:8px;letter-spacing:.12em}.value{font-size:15px}.inputbar{padding:10px 12px;gap:9px}.keys{font-size:9px}.subtitle{font-size:9px}footer{font-size:9px}}
  @media(max-width:390px){.keys{display:none}.stat{padding-left:7px;padding-right:7px}.label{font-size:7px}}
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><div class="mark">⌘</div><div><h1>ROBÔ REBELDE</h1><div class="subtitle">ARCADE DE DIGITAÇÃO // SETOR 07</div></div></div>
    <div class="status">SISTEMA <span style="color:var(--cyan)">● ONLINE</span><br>OPERADOR: VOCÊ</div>
  </header>
  <section class="board" aria-label="Jogo Robô Rebelde">
    <div class="hud">
      <div class="stat"><div class="label">Pontuação</div><div class="value" id="score">000000</div></div>
      <div class="stat"><div class="label">Nível</div><div class="value" id="level">01</div></div>
      <div class="stat"><div class="label">Velocidade</div><div class="value" id="speed">1.0 <small>×</small></div></div>
      <div class="stat"><div class="label">Integridade</div><div class="value" id="energy">♥ ♥ ♥</div></div>
    </div>
    <div class="canvas-wrap"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Campo do jogo. Digite as palavras dos alvos para agir."></canvas></div>
    <div class="inputbar"><div class="prompt-icon">&gt;_</div><div class="input-copy"><div class="input-label">Comando em digitação</div><input id="typed" class="empty" type="text" placeholder="Toque aqui para digitar" aria-label="Digite a palavra do alvo" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"></div><div class="keys"><b>ESC</b> pausar &nbsp; <b>⌫</b> corrigir</div></div>
  </section>
  <button id="action-button" class="game-action" type="button">🎮 COMEÇAR A JOGAR</button>
  <footer><div class="legend"><span><i class="dot c-cyan"></i> SALTO / desvio</span><span><i class="dot c-violet"></i> ATAQUE</span><span><i class="dot c-gold"></i> CRISTAL</span></div><div>TECLADO PRONTO</div></footer>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),speedEl=document.getElementById('speed'),energyEl=document.getElementById('energy'),typedEl=document.getElementById('typed');
const W=960,H=540,FLOOR=424,ROBOT_X=190;
const palette={cyan:'#5ef2dc',violet:'#a88bff',gold:'#ffd76a',red:'#ff6482',white:'#edf4ff',muted:'#8293ad'};
const words={hazard:['SALTO','DESVIO','IMPULSO','PULO'],enemy:['PULSO','ATAQUE','LASER','DISPARO'],crystal:['CRISTAL','NUCLEO','ENERGIA','BRILHO']};
let state='title',score=0,level=1,lives=3,baseSpeed=190,elapsed=0,spawnClock=0,lastTime=0,entities=[],particles=[],stars=[],input='',selected=null,robotJump=0,robotAttack=0,flash=0,notice='',noticeTime=0,shake=0,runFrame=0;
for(let i=0;i<74;i++)stars.push({x:Math.random()*W,y:Math.random()*(FLOOR-35),r:Math.random()*1.5+.4,a:Math.random()*.45+.12,speed:Math.random()*23+8});
function reset(){score=0;level=1;lives=3;baseSpeed=190;elapsed=0;spawnClock=.3;entities=[];particles=[];input='';selected=null;robotJump=0;robotAttack=0;flash=0;notice='';noticeTime=0;shake=0;runFrame=0;state='playing';lastTime=performance.now();updateHud();setTyped();updateControls();addEntity('hazard',730);addEntity('crystal',970);}
function updateHud(){scoreEl.textContent=String(score).padStart(6,'0');levelEl.textContent=String(level).padStart(2,'0');speedEl.innerHTML=(baseSpeed/190).toFixed(1)+' <small>×</small>';energyEl.textContent='♥ '.repeat(lives).trim()||'—';energyEl.style.opacity=lives===1?'.72':'1';}
function setTyped(){typedEl.value=input;typedEl.placeholder='Toque aqui para digitar';typedEl.classList.toggle('empty',!input);}
function addEntity(type,x=W+50){const choices=words[type];entities.push({id:Math.random().toString(36).slice(2),type,x,y:FLOOR,word:choices[Math.floor(Math.random()*choices.length)],done:false,age:0});}
function spawn(){let r=Math.random();let type=r<.43?'hazard':r<.74?'enemy':'crystal';addEntity(type);}
function colorFor(type){return type==='hazard'?palette.cyan:type==='enemy'?palette.violet:palette.gold;}
function drawGrid(){ctx.fillStyle='#0a101a';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,FLOOR);g.addColorStop(0,'#0a101a');g.addColorStop(1,'#111b29');ctx.fillStyle=g;ctx.fillRect(0,0,W,FLOOR+1);
  for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#b9d0ec';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
  ctx.strokeStyle='#172437';ctx.lineWidth=1;for(let y=70;y<FLOOR;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.fillStyle='#111d2b';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.strokeStyle='#26394d';ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();
  ctx.strokeStyle='#203146';ctx.lineWidth=1;const offset=(elapsed*baseSpeed*.42)%58;for(let x=-60+offset;x<W;x+=58){ctx.beginPath();ctx.moveTo(x,FLOOR+2);ctx.lineTo(x-38,H);ctx.stroke()}
  ctx.fillStyle='#5ef2dc';ctx.globalAlpha=.7;ctx.fillRect(0,FLOOR-2,W,2);ctx.globalAlpha=1;
}
function drawRobot(){let lift=robotJump>0?Math.sin((1-robotJump/0.72)*Math.PI)*88:0;let y=FLOOR-7-lift;let bob=state==='playing'&&robotJump<=0?Math.sin(runFrame*9)*2:0;y+=bob;ctx.save();ctx.translate(ROBOT_X,y);if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.shadowColor='#5ef2dc';ctx.shadowBlur=robotJump>0?22:10;ctx.lineWidth=3;ctx.strokeStyle=palette.cyan;ctx.fillStyle='#122c35';
  // antenna
  ctx.beginPath();ctx.moveTo(0,-63);ctx.lineTo(0,-76);ctx.stroke();ctx.beginPath();ctx.arc(0,-79,3,0,Math.PI*2);ctx.fillStyle=palette.gold;ctx.fill();
  // head
  roundRect(ctx,-27,-64,54,39,9);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#06141b';roundRect(ctx,-19,-55,38,17,5);ctx.fill();ctx.fillStyle=palette.cyan;ctx.fillRect(-12,-49,6,4);ctx.fillRect(6,-49,6,4);
  // torso
  ctx.fillStyle='#152b37';ctx.strokeStyle='#5ef2dc';roundRect(ctx,-23,-21,46,30,7);ctx.fill();ctx.stroke();ctx.fillStyle='#ffd76a';ctx.fillRect(-5,-12,10,9);
  // arms and legs
  ctx.lineWidth=5;ctx.strokeStyle=palette.cyan;ctx.beginPath();ctx.moveTo(-22,-14);ctx.lineTo(-34,1);ctx.moveTo(22,-14);ctx.lineTo(32,-3);ctx.stroke();
  if(robotAttack>0){ctx.shadowColor=palette.violet;ctx.shadowBlur=18;ctx.strokeStyle=palette.violet;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(30,-9);ctx.lineTo(65,-32);ctx.stroke();ctx.beginPath();ctx.arc(69,-35,7,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
  ctx.lineWidth=6;ctx.strokeStyle='#8293ad';ctx.beginPath();ctx.moveTo(-12,8);ctx.lineTo(-15,23);ctx.lineTo(-25,24);ctx.moveTo(12,8);ctx.lineTo(15,23);ctx.lineTo(25,24);ctx.stroke();
  ctx.fillStyle='#0a101a';ctx.beginPath();ctx.ellipse(0,27,39,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function drawTarget(e){const col=colorFor(e.type);const x=e.x,y=FLOOR;ctx.save();ctx.shadowColor=col;ctx.shadowBlur=10;ctx.lineWidth=2;ctx.strokeStyle=col;ctx.fillStyle=e.type==='hazard'?'#10272d':e.type==='enemy'?'#211a34':'#2b2615';
  if(e.type==='hazard'){ctx.beginPath();ctx.moveTo(x-23,y);ctx.lineTo(x-13,y-43);ctx.lineTo(x,y-19);ctx.lineTo(x+13,y-47);ctx.lineTo(x+24,y);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#10232c';ctx.beginPath();ctx.moveTo(x-15,y-9);ctx.lineTo(x+15,y-9);ctx.stroke()}
  else if(e.type==='enemy'){roundRect(ctx,x-25,y-42,50,40,10);ctx.fill();ctx.stroke();ctx.fillStyle=col;ctx.fillRect(x-15,y-29,7,5);ctx.fillRect(x+8,y-29,7,5);ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(x-8,y-13);ctx.lineTo(x+8,y-13);ctx.stroke();ctx.beginPath();ctx.moveTo(x-29,y-25);ctx.lineTo(x-37,y-17);ctx.moveTo(x+29,y-25);ctx.lineTo(x+37,y-17);ctx.stroke()}
  else {ctx.translate(x,y-28);ctx.rotate(Math.PI/4);ctx.fillStyle='#332a13';ctx.fillRect(-13,-13,26,26);ctx.strokeRect(-13,-13,26,26);ctx.fillStyle=col;ctx.fillRect(-6,-6,12,12);ctx.rotate(-Math.PI/4);ctx.translate(-x,-(y-28));ctx.fillStyle=col;ctx.globalAlpha=.26;ctx.beginPath();ctx.ellipse(x,y-13,30,5,0,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  const wordY=e.type==='crystal'?y-91:y-94;ctx.font='bold 13px ui-monospace,monospace';let width=ctx.measureText(e.word).width+25;ctx.fillStyle='#09111b';ctx.strokeStyle=col+'99';ctx.lineWidth=1;roundRect(ctx,x-width/2,wordY-17,width,25,6);ctx.fill();ctx.stroke();
  let typedPart=selected===e.id?input:'';ctx.textAlign='center';ctx.textBaseline='middle';const full=e.word;const part=typedPart.toUpperCase();if(part&&full.startsWith(part)){ctx.fillStyle=col;ctx.fillText(part,x-width/2+12+ctx.measureText(part).width/2,wordY-5);ctx.fillStyle='#dce7f5';ctx.fillText(full.slice(part.length),x-width/2+12+ctx.measureText(part).width+ctx.measureText(full.slice(part.length)).width/2,wordY-5)}else{ctx.fillStyle=col;ctx.fillText(full,x,wordY-5)}ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='9px ui-monospace,monospace';ctx.textAlign='center';ctx.fillStyle=col;ctx.globalAlpha=.8;ctx.fillText(e.type==='hazard'?'PULAR':e.type==='enemy'?'ATACAR':'COLETAR',x,y+25);ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawScene(){drawGrid();let nearLine=ROBOT_X+64;ctx.setLineDash([4,7]);ctx.strokeStyle='#30445a';ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(nearLine,FLOOR-112);ctx.lineTo(nearLine,FLOOR+3);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  entities.forEach(drawTarget);drawRobot();
  if(noticeTime>0){ctx.textAlign='center';ctx.font='bold 13px ui-monospace,monospace';ctx.fillStyle=notice.includes('ERRO')||notice.includes('DANO')?palette.red:palette.cyan;ctx.fillText(notice,W/2,70);ctx.textAlign='left'}
  if(flash>0){ctx.fillStyle=`rgba(255,100,130,${flash*.08})`;ctx.fillRect(0,0,W,H)}
  if(state==='title'||state==='paused'||state==='over')drawOverlay();
}
function drawOverlay(){ctx.fillStyle='rgba(5,9,16,.74)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';
  if(state==='title'){ctx.font='bold 13px ui-monospace,monospace';ctx.fillStyle=palette.cyan;ctx.fillText('SINAL DETECTADO // SETOR SOB ATAQUE',W/2,147);ctx.font='bold 43px ui-monospace,monospace';ctx.fillStyle=palette.white;ctx.fillText('DIGITE. SOBREVIVA.',W/2,207);ctx.font='14px ui-monospace,monospace';ctx.fillStyle='#a6b5ca';ctx.fillText('Toque em começar e digite a palavra do alvo.',W/2,250);ctx.fillStyle='#7587a0';ctx.font='12px ui-monospace,monospace';ctx.fillText('DESVIE DOS OBSTÁCULOS  ·  ATAQUE DRONES  ·  COLETE CRISTAIS',W/2,278);drawButton('TOQUE EM COMEÇAR PARA JOGAR',W/2,354)}
  if(state==='paused'){ctx.font='bold 38px ui-monospace,monospace';ctx.fillStyle=palette.white;ctx.fillText('PAUSADO',W/2,224);ctx.font='14px ui-monospace,monospace';ctx.fillStyle=palette.cyan;ctx.fillText('Use o botão abaixo para continuar',W/2,275)}
  if(state==='over'){ctx.font='bold 13px ui-monospace,monospace';ctx.fillStyle=palette.red;ctx.fillText('SINAL PERDIDO // ROBÔ DESATIVADO',W/2,174);ctx.font='bold 42px ui-monospace,monospace';ctx.fillStyle=palette.white;ctx.fillText('FIM DE JOGO',W/2,233);ctx.font='15px ui-monospace,monospace';ctx.fillStyle=palette.gold;ctx.fillText('PONTUAÇÃO  '+String(score).padStart(6,'0'),W/2,281);drawButton('TOQUE EM COMEÇAR PARA JOGAR NOVAMENTE',W/2,351)}
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawButton(text,x,y){ctx.font='bold 13px ui-monospace,monospace';const w=ctx.measureText(text).width+42;ctx.fillStyle='#12242d';ctx.strokeStyle='#5ef2dc';ctx.lineWidth=1;roundRect(ctx,x-w/2,y-21,w,42,8);ctx.fill();ctx.stroke();ctx.fillStyle=palette.cyan;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y+1)}
function burst(x,y,color,count=12){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=Math.random()*150+45;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,life:.45+Math.random()*.55,max:.9,color,size:Math.random()*3+1})}}
function action(e){e.done=true;selected=null;input='';setTyped();if(e.type==='hazard'){robotJump=.72;score+=25;notice='DESVIO PERFEITO  +25';burst(ROBOT_X+30,FLOOR-20,palette.cyan,9)}else if(e.type==='enemy'){robotAttack=.38;score+=40;notice='DRONE NEUTRALIZADO  +40';burst(e.x,FLOOR-28,palette.violet,18)}else{score+=60;notice='CRISTAL COLETADO  +60';burst(e.x,FLOOR-27,palette.gold,16)}noticeTime=1.05;level=Math.floor(score/220)+1;baseSpeed=190+Math.min(level-1,12)*17;updateHud();}
function hurt(){lives--;flash=.75;shake=8;notice='DANO RECEBIDO  //  INTEGRIDADE -1';noticeTime=1.1;updateHud();if(lives<=0){state='over';input='';selected=null;setTyped();updateControls()} }
function eligible(){return entities.filter(e=>!e.done&&e.x>ROBOT_X-20&&e.x<790).sort((a,b)=>Math.abs(a.x-ROBOT_X)-Math.abs(b.x-ROBOT_X))}
function backspaceInput(){if(input){input=input.slice(0,-1);if(!input){selected=null}else if(selected&&!entities.some(e=>e.id===selected&&e.word.startsWith(input.toUpperCase())))selected=null;setTyped()}}
function processLetter(raw){if(state!=='playing')return;const ch=raw.toUpperCase();if(!/^[A-Z]$/.test(ch))return;
  if(selected){const e=entities.find(o=>o.id===selected&&!o.done);if(e&&e.word.startsWith((input+ch).toUpperCase())){input+=ch;setTyped();if(input.toUpperCase()===e.word)action(e);return}input='';selected=null;}
  const match=eligible().find(e=>e.word.startsWith(ch));if(match){selected=match.id;input=ch;setTyped();if(input===match.word)action(match)}else{input=ch;setTyped();notice='COMANDO NÃO RECONHECIDO';noticeTime=.45;setTimeout(()=>{if(input===ch&&!selected){input='';setTyped()}},260)}
}
function keydown(ev){if(ev.ctrlKey||ev.metaKey||ev.altKey)return;const k=ev.key;
  if(k==='Escape'){ev.preventDefault();if(state==='playing'){state='paused';input='';selected=null;setTyped();updateControls()}else if(state==='paused'){state='playing';lastTime=performance.now();updateControls()}return}
  if(state==='title'||state==='over'){if(k==='Enter'||k===' '){ev.preventDefault();reset();typedEl.focus({preventScroll:true})}return}
  if(state!=='playing')return;
  if(k==='Backspace'){ev.preventDefault();backspaceInput();return}
  if(k==='Enter'){ev.preventDefault();input='';selected=null;setTyped();return}
  if(!/^[a-zA-Z]$/.test(k))return;ev.preventDefault();processLetter(k)
}
function updateControls(){const b=document.getElementById('action-button');if(!b)return;b.textContent=state==='playing'?'Ⅱ PAUSAR':state==='paused'?'▶ CONTINUAR':state==='over'?'↻ JOGAR NOVAMENTE':'🎮 COMEÇAR A JOGAR';b.setAttribute('aria-label',b.textContent)}

function update(dt){elapsed+=dt;runFrame+=dt;spawnClock+=dt;if(spawnClock>Math.max(.78,1.38-(level-1)*.035)){spawnClock=0;spawn()}
  stars.forEach(s=>{s.x-=s.speed*dt;if(s.x<0){s.x=W;s.y=Math.random()*(FLOOR-35)}});
  if(robotJump>0)robotJump=Math.max(0,robotJump-dt);if(robotAttack>0)robotAttack=Math.max(0,robotAttack-dt);if(flash>0)flash=Math.max(0,flash-dt);if(shake>0)shake=Math.max(0,shake-dt*18);if(noticeTime>0)noticeTime-=dt;
  for(const e of entities){e.x-=baseSpeed*dt;e.age+=dt;if(!e.done&&e.x<ROBOT_X+27){if(e.type!=='crystal')hurt();e.done=true;if(state==='over')break}}
  entities=entities.filter(e=>!e.done&&e.x>-70);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
  if(score>0){const newLevel=Math.floor(score/220)+1;if(newLevel>level){level=newLevel;baseSpeed=190+Math.min(level-1,12)*17;updateHud();notice='NÍVEL '+String(level).padStart(2,'0')+' // VELOCIDADE AUMENTADA';noticeTime=1.2}}
}
function renderParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1}
function frame(now){let dt=Math.min((now-lastTime)/1000||0,.04);lastTime=now;if(state==='playing')update(dt);drawScene();renderParticles();requestAnimationFrame(frame)}
document.addEventListener('keydown',keydown);
typedEl.addEventListener('input',()=>{if(state!=='playing'){setTyped();return}const value=typedEl.value.toUpperCase();let added='';if(value.startsWith(input.toUpperCase()))added=value.slice(input.length);else if(input.toUpperCase().startsWith(value)){for(let n=input.length-value.length;n>0;n--)backspaceInput();return}else{while(input)backspaceInput();added=value}setTyped();for(const ch of added)processLetter(ch)});
const actionButton=document.getElementById('action-button');actionButton.addEventListener('click',()=>{if(state==='title'||state==='over')reset();else if(state==='playing'){state='paused';input='';selected=null;setTyped()}else if(state==='paused'){state='playing';lastTime=performance.now()}updateControls();if(state==='playing')typedEl.focus({preventScroll:true})});
canvas.addEventListener('pointerdown',()=>{if(state==='title'||state==='over')reset();if(state==='playing')typedEl.focus({preventScroll:true})});
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#090d16');tg.setBackgroundColor('#090d16');if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){console.warn('Telegram WebApp SDK:',e)}}
canvas.focus();updateHud();setTyped();updateControls();requestAnimationFrame(t=>{lastTime=t;frame(t)});
})();
</script>
</body>
